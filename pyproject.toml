[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
voice = [
  "faster-whisper>=1.1.1",
  "sounddevice>=0.5.2",
]

[tool.setuptools.packages.find]
include = ["jarvis_app*"]
